[build]
  base = "nextjs-app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Next.js's internal webpack build cache can retain traces of server-only
  # env vars (ANTHROPIC_API_KEY, Supabase credentials, etc.) that are
  # legitimately read via process.env in server code. This cache is never
  # served to visitors, so it's excluded from secret scanning rather than
  # disabling the scan entirely.
  # Covers both the raw build-time cache location and the path it ends up
  # at after the Next.js runtime plugin stages the deploy output under
  # .netlify/ — Netlify's scanner reported the latter.
  # Paths are relative to the REPO ROOT, not the `base` directory above —
  # since our app lives under nextjs-app/, the cache paths need that prefix.
  SECRETS_SCAN_OMIT_PATHS = "nextjs-app/.next/cache/**,nextjs-app/.netlify/.next/cache/**,.next/cache/**,.netlify/.next/cache/**"
  # Path-based exclusion above keeps getting out-scanned by new locations
  # (webpack cache, then the resolved-config log section). These are all
  # legitimate server-only secrets — never imported into any client
  # component, never NEXT_PUBLIC_-prefixed — so omit by key name instead of
  # playing whack-a-mole with every internal log/cache path that happens to
  # reference them. ANTHROPIC_MODEL, SOLVE_CONFIDENCE_THRESHOLD,
  # DAILY_FREE_SOLVE_LIMIT, and MAX_CHAT_HISTORY aren't actually sensitive
  # (a model id string and plain tuning numbers) but Netlify's scanner
  # flags any configured env var whose value appears in build output,
  # regardless of sensitivity.
  #
  # NOTE: as of 2026-10-31, setting this in netlify.toml alone did not
  # reliably take effect — it had to also be set as an actual Netlify
  # dashboard environment variable (Site configuration > Environment
  # variables) for the scanner to honor it. Kept here for documentation/
  # fallback, but the dashboard value is the one that's load-bearing.
  SECRETS_SCAN_OMIT_KEYS = "ANTHROPIC_API_KEY,ANTHROPIC_MODEL,SUPABASE_SERVICE_ROLE_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SYMPY_VERIFY_SERVICE_TOKEN,UPSTASH_REDIS_REST_TOKEN,SOLVE_CONFIDENCE_THRESHOLD,DAILY_FREE_SOLVE_LIMIT,MAX_CHAT_HISTORY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
